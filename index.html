<!DOCTYPE html>
<html lang="en">
<head>

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RK5FCRC4BF');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Alicia</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #120208;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Nunito', 'Segoe UI', cursive, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Intro Sequence */
  #intro {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #120208;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #ffb3d9;
    z-index: 20;
    transition: opacity 1.5s ease, visibility 1.5s ease;
  }

  #intro p {
    font-size: 1.5rem; /* Smaller text */
    margin-bottom: 1.5rem;
    text-shadow: 0 0 8px rgba(255, 179, 217, 0.4);
    text-align: center;
    padding: 0 20px;
    font-weight: normal;
  }

  #enter-btn {
    padding: 8px 24px;
    font-size: 0.9rem; /* Minimalist button */
    color: #ffb3d9;
    background-color: transparent;
    border: 1px solid #ffb3d9;
    cursor: pointer;
    border-radius: 20px;
    font-family: 'Comic Sans MS', cursive;
    transition: all 0.3s ease;
    letter-spacing: 1px;
  }

  #enter-btn:hover {
    background-color: rgba(255, 179, 217, 0.1);
    box-shadow: 0 0 10px rgba(255, 179, 217, 0.2);
  }
  
  #enter-btn:active {
    transform: scale(0.95);
  }

  /* Matrix Canvas */
  #matrix-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .Love__You {
    color: #ff99cc;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Comic Sans MS', cursive;
    min-height: 100vh;
    width: 100vw;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 10;
    font-size: 3rem;
    text-shadow: 0 0 10px #ff99cc;
    transition: all 0.5s ease;
  }
  
  /* clickty click pop */
  .Love__You.click-pop {
    min-height: auto;
    width: max-content;
    padding: 10px 20px; /* Smaller padding */
    background: rgba(255, 153, 204, 0.15); 
    border: 1px solid rgba(255, 153, 204, 0.3);
    border-radius: 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    pointer-events: none; 
    user-select: none;
    -webkit-user-select: none;
    
    font-size: 1rem; /* pop text */
    color: #fff;
    text-shadow: 0 0 5px #ff66b2, 0 0 10px #ff3399;
    line-height: 1.4;
    text-align: center;
    
    /* Faster fade time (1.2 seconds) */
    animation: popFadeEffect 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes popFadeEffect {
    0% { 
      transform: translate(-50%, -50%) scale(0.5); 
      opacity: 0; 
    }
    20% { 
      transform: translate(-50%, -50%) scale(1.1); 
      opacity: 1; 
    }
    35% { 
      transform: translate(-50%, -50%) scale(1); 
      opacity: 1; 
    }
    70% { 
      transform: translate(-50%, -50%) scale(1); 
      opacity: 1; 
    }
    100% { 
      transform: translate(-50%, -50%) scale(1.05); 
      opacity: 0; 
    }
  }

  /* Visual cue particle spark for pops */
  .pop-particle {
    position: absolute;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    z-index: 12;
    font-size: 0.95rem;
    will-change: transform, opacity;
    animation: particleFloat 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  @keyframes particleFloat {
    0% { 
      transform: translate(-50%, -50%) scale(0.5); 
      opacity: 1; 
    }
    100% { 
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.2); 
      opacity: 0; 
    }
  }

</style>
</head>
<body>

  <!-- The song that keeps me dreaming -->
  <audio id="bg-music" src="【中日歌詞⧸Romaji】上伊那ぼたん、酔へる姿は百合の花 ED - 感情グラス ⧸ Kamiina Botan ED - Kanjou Glass (中字翻譯⧸Lyrics) [vw39buSirG0].m4a" loop></audio>

  <!-- Intro Screen -->
  <div id="intro">
    <p>For Alicia...</p>
    <button id="enter-btn">enter</button>
  </div>

  <!-- Matrix Canvas -->
  <canvas id="matrix-canvas"></canvas>

  <script>
    const intro = document.getElementById('intro');
    const enterBtn = document.getElementById('enter-btn');
    const bgMusic = document.getElementById('bg-music');
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    
    let animId = null;

    enterBtn.addEventListener('click', () => {
      intro.style.opacity = '0';
      setTimeout(() => {
        intro.style.visibility = 'hidden';
      }, 1500);

      bgMusic.volume = 0.85;
      bgMusic.play().catch(e => {
        console.warn('Audio play failed:', e);
      });
      
      startMatrix();
    });

    let drops = [];
    const fontSize = 15;
    const columnWidth = 42; /* Maximum overwhelming squish */
    const words = ["chomp", "nom", "poke", "pinch", "love", "cutie", "alicia", "chu", "forever", "little alicia", "sister", "my angel", "cuddles", "nibble", "wiggle wiggle", "愛してる", "大好き", "大切", "優しい", "恋", "secret", "fly", "bittersweet", "hesitant", "秘密", "飛ぶ", "甘酸っぱい", "躊躇い", "切ない", "憧れ", "儚い"];

    const pinkShades = [
      "rgba(255, 182, 193, 0.95)", // soft baby pink
      "rgba(255, 153, 204, 0.9)",  // sweet bubblegum
      "rgba(255, 105, 180, 0.95)", // vivid hot pink
      "rgba(255, 204, 230, 0.88)", // blush
      "rgba(255, 255, 255, 0.95)", // sparkling white accent
      "rgba(255, 140, 190, 0.92)"  // rose
    ];

    // a rare chance for a hidden word? Hmm maybe
    function getRandomWord() {
      if (Math.random() > 0.988) { // rare hidden whisper
        return { text: "watching you", color: "rgba(204, 102, 153, 0.65)" }; // slightly darker and transparent
      }
      return { 
        text: words[Math.floor(Math.random() * words.length)], 
        color: pinkShades[Math.floor(Math.random() * pinkShades.length)]
      };
    }

    // dpi go brrrrr
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function createDrop(posX, yOffset) {
      return {
        x: posX,
        y: yOffset,
        speed: 0.75 + Math.random() * 0.85,
        ...getRandomWord()
      };
    }

    function initMatrix() {
      resizeCanvas();
      const columns = Math.floor(window.innerWidth / columnWidth) + 1;
      drops = [];
      
      // Massive dense saturation: 8 staggered waves per column across the screen
      for (let x = 0; x < columns; x++) {
        const posX = x * columnWidth + (columnWidth / 2);
        for (let w = 0; w < 8; w++) {
          drops.push(createDrop(posX, (Math.random() * -20) - (w * 7)));
        }
      }
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(18, 2, 8, 0.15)';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      ctx.font = fontSize + 'px "Comic Sans MS", "Nunito", cursive';
      ctx.textAlign = 'center';

      for (let i = 0; i < drops.length; i++) {
        const drop = drops[i];
        const y = drop.y * fontSize;
        
        ctx.fillStyle = drop.color;
        ctx.fillText(drop.text, drop.x, y);

        if (y > window.innerHeight && Math.random() > 0.92) {
          drop.y = Math.random() * -4;
          drop.speed = 0.75 + Math.random() * 0.85;
          const newWord = getRandomWord();
          drop.text = newWord.text;
          drop.color = newWord.color;
        }
        drop.y += drop.speed;
      }
    }

    // yummy animation
    let lastTime = 0;
    const interval = 45; // faster, thrillingly intense flow

    function loop(currentTime) {
      if (!lastTime) lastTime = currentTime;
      const delta = currentTime - lastTime;

      if (delta >= interval) {
        drawMatrix();
        lastTime = currentTime - (delta % interval);
      }
      animId = requestAnimationFrame(loop);
    }

    function startMatrix() {
      initMatrix();
      if (!animId) {
        animId = requestAnimationFrame(loop);
      }
    }

    // Smooth smoother smoothie?
    window.addEventListener('resize', () => {
      resizeCanvas();
      const currentCols = Math.floor(window.innerWidth / columnWidth) + 1;
      for (let x = 0; x < currentCols; x++) {
        const posX = x * columnWidth + (columnWidth / 2);
        const hasDrop = drops.some(d => Math.abs(d.x - posX) < 8);
        if (!hasDrop) {
          for (let w = 0; w < 8; w++) {
            drops.push(createDrop(posX, (Math.random() * -15) - (w * 7)));
          }
        }
      }
    });

    // better compatiabilty hoepfully
    function triggerPop(x, y) {
      const word = document.createElement('div');
      word.className = 'Love__You click-pop';
      
      word.innerHTML = '❤️>_< <br>love you so much my little Alicia<br>ty for being with me';
      
      word.style.left = x + 'px';
      word.style.top = y + 'px';
      
      document.body.appendChild(word);
      
      // hmm maybe next time try adding more visual cues for the pops, nom whatcha reading here, anways I love you even as a sis or anything just know I always have you on my mind and I just hope you'll be happy
      setTimeout(() => {
        word.remove();
      }, 1200);

      // the new taps been added yay
      const particles = ['✨', '💖', '🌸', '💕', '⭐'];
      for (let i = 0; i < 5; i++) {
        const p = document.createElement('span');
        p.className = 'pop-particle';
        p.innerText = particles[Math.floor(Math.random() * particles.length)];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const angle = (Math.PI * 2 * i) / 5 + (Math.random() - 0.5) * 0.6;
        const dist = 30 + Math.random() * 25;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 750);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      triggerPop(e.clientX, e.clientY);
    });

  </script>
</body>
</html>
